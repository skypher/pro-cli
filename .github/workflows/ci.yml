name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # The gate's quoting test also checks zsh where it is installed.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
